<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遊戲攻略｜榮耀 Online</title>
<meta name="description" content="榮耀 Online 遊戲攻略與最新遊戲資訊，整理熱門賽事、遊戲玩法與實用攻略內容。">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="icon" href="logo.png" type="image/png">
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#343434;--mute:#9a9a9a;--line:#e8e8e8;--gold:#b8892e;--dark:#21150c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:10;background:rgba(25,16,10,.96);border-bottom:1px solid rgba(230,192,113,.25);box-shadow:0 3px 14px rgba(0,0,0,.12)}
.topbar-inner{width:min(1180px,calc(100% - 32px));height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;color:#f5eee1;font-family:Georgia,"Noto Serif TC",serif;font-weight:900;font-size:20px}
.brand img{height:46px;width:auto;display:block}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;border:1px solid #8a6a2c;color:#f1dfb4;background:#2b1b0e;font-weight:700}
.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}
.hero{padding:46px 0 28px}
.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(30px,5vw,48px);line-height:1.25;color:#21150c}
.hero p{margin-top:8px;color:#777;font-size:16px}
.articles{padding:0 0 70px}
.article-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.article-card{display:block;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.06);overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.article-card:hover{transform:translateY(-4px);border-color:#d7c18f;box-shadow:0 12px 30px rgba(0,0,0,.10)}
.article-card img{display:block;width:100%;aspect-ratio:359/267;object-fit:cover}
.article-body{padding:14px 14px 18px}
.views{color:#a0a0a0;font-size:14px;margin-bottom:3px}
.article-title{font-size:18px;font-weight:700;line-height:1.55;color:#4a4a4a}
.article-more{display:inline-block;margin-top:12px;color:var(--gold);font-size:14px;font-weight:700}
.empty-note{margin-top:28px;padding:18px 20px;background:#fff;border:1px solid var(--line);color:#777;font-size:14px}
footer{padding:26px 0 34px;background:#21150c;color:#aaa;font-size:13px}
@media(max-width:768px){
  .topbar-inner{height:62px}
  .brand{font-size:17px}
  .brand img{height:42px}
  .back{min-height:38px;padding:0 13px;font-size:13px}
  .hero{padding:28px 0 20px}
  .hero h1{font-size:30px}
  .hero p{font-size:14px}
  .article-grid{grid-template-columns:1fr;gap:18px}
  .article-body{padding:11px 10px 15px}
  .article-title{font-size:17px;line-height:1.5}
  .articles{padding-bottom:46px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html#top"><img src="logo.png" alt="榮耀 Online">榮耀 Online</a>
    <a class="back" href="index.html#top">返回首頁</a>
  </div>
</header>
<main>
  <section class="hero">
    <div class="wrap">
      <h1>遊戲攻略</h1>
      <p>最新遊戲資訊、玩法攻略與熱門內容整理</p>
    </div>
  </section>
  <section class="articles">
    <div class="wrap">
      <div class="article-grid">
        <article class="article-card">
          <img src="guide1.jpg" alt="2026世界盃進球榜：金靴獎最新射手排名">
          <div class="article-body">
            <div class="views">瀏覽數：998</div>
            <div class="article-title">2026世界盃進球榜：金靴獎最新射手排名（即時更新）</div>
            <span class="article-more">閱讀攻略 ›</span>
          </div>
        </article>
        <article class="article-card">
          <img src="guide2.jpg" alt="2026世界盃助攻榜：最佳助攻手排名">
          <div class="article-body">
            <div class="views">瀏覽數：495</div>
            <div class="article-title">2026世界盃助攻榜：最佳助攻手排名（即時更新）</div>
            <span class="article-more">閱讀攻略 ›</span>
          </div>
        </article>
      </div>
      <div class="empty-note">攻略文章區已建立，之後新增文章時可直接在這裡增加文章卡片。</div>
    </div>
  </section>
</main>
<footer><div class="wrap">© 2026 榮耀 Online｜遊戲攻略</div></footer>
</body>
</html>
